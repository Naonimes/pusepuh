<!DOCTYPE html>
<html lang="id">
<head>
    <title>pusepuh - Make a New Thread</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&family=Roboto:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <header>
        <nav class="menu-ikon">
            <a href="home.html">Home</a>
            <a href="buat-thread.html">New Thread</a>
            <a href="tema.html">Mode</a>
        </nav>
        
        <h1>Make a New Thread</h1>
    </header>

    <main>
        <div class="wadah-form">
            <form action="proses-upload.html" method="POST" enctype="multipart/form-data">
                
                <div class="grup-input">
                    <label for="judul-thread">Judul Karya / Topik:</label><br>
                    <input type="text" id="judul-thread" name="judul" required placeholder="Ketik judulnya puh" size="40">
                </div>
                
                <div class="grup-input">
                    <label for="kategori-board">Pilih Board (Kategori):</label><br>
                    <select id="kategori-board" name="kategori" required>
                        <option value="">-- Silakan Pilih Kategori --</option>
                        <option value="g">/g/ - Gambar</option>
                        <option value="k">/k/ - Krisar (Kritik & Saran)</option>
                        <option value="t">/t/ - Tanya</option>
                        <option value="h">/h/ - Hobi (Anime, Game)</option>
                        <option value="q">/q/ - Site Feedback</option>
                        <option value="r">/r/ - Random</option>
                    </select>
                </div>
                
                <div class="grup-input">
                    <label for="file-gambar">Unggah Gambar (Opsional):</label><br>
                    <input type="file" id="file-gambar" name="gambar" accept="image/*">
                </div>
                
                <div class="grup-input">
                    <label for="isi-thread">Deskripsi / Caption:</label><br>
                    <textarea id="isi-thread" name="isi" rows="6" cols="50" required placeholder="Jadi ini mau posting apaan puh?"></textarea>
                </div>
                
                <div class="grup-tombol">
                    <button type="submit">Unggah Thread</button>
                    <button type="reset" class="tombol-batal">Batal</button>
                </div>

            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 pusepuh - Media Sosial Artist Digital Terbesar di Indonesia </p>
    </footer>
</body>
</html>
